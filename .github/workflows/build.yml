name: build-git-standalone

on:
  workflow_dispatch:
  push:
    branches:
      - portable-paths

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential musl-tools wget curl xz-utils perl patch pkg-config

      - name: Build
        run: |
          chmod +x build.sh
          JOBS="$(nproc)" ./build.sh

      - name: Inspect artifact
        run: |
          file work/git
          sha256sum work/git

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-standalone-arm64
          path: work/git
          if-no-files-found: error
